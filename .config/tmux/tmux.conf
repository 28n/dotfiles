# tmux — Tokyo workspace
# Prefix: C-a. Reload: prefix + r. Help: prefix + ?.

##### Terminal and server behavior

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set -g focus-events on
set -g set-clipboard on
set -g escape-time 0
set -g history-limit 100000
set -g repeat-time 400
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "tmux:#S · #W"
set -g status-interval 2
set -g display-time 2500
set -g mode-keys vi
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

##### Prefix and config controls

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  tmux reloaded  "
bind ? list-keys

##### Windows and panes inherit the current directory

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane movement. C-a h/j/k/l selects; capitals resize.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind e select-layout even-horizontal
bind E select-layout even-vertical

# Intuitive window movement.
bind -r C-h previous-window
bind -r C-l next-window
bind -r '<' swap-window -t -1 \; select-window -t -1
bind -r '>' swap-window -t +1 \; select-window -t +1

##### Popups and sessions

bind f display-popup -E -w 80% -h 70% "~/.custom/bin/tmux-sessionizer"
bind t display-popup -E -w 85% -h 75% -d "#{pane_current_path}" "$SHELL -l"
bind b display-popup -E -w 90% -h 85% "btop"
bind s choose-tree -Zw

##### Selection and clipboard

bind [ copy-mode
bind ] paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

##### Tokyo-night appearance

set -g status-position top
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] 󰆍 #S #[bg=#1a1b26,fg=#7aa2f7] "
set -g status-right "#[fg=#565f89]#{?client_prefix,#[fg=#f7768e bold] PREFIX  ,}#[fg=#7dcfff]#[bg=#7dcfff,fg=#16161e,bold] 󰉋 #{b:pane_current_path} #[fg=#bb9af7,bg=#7dcfff]#[bg=#bb9af7,fg=#16161e,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26]  #I:#W#{?window_zoomed_flag, 󰊓,}  "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#9ece6a,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=#e0af68,bg=#1a1b26,bold"
setw -g window-status-bell-style "fg=#f7768e,bg=#1a1b26,bold"

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status off
set -g message-style "bg=#7aa2f7,fg=#16161e,bold"
set -g message-command-style "bg=#bb9af7,fg=#16161e,bold"
set -g mode-style "bg=#7aa2f7,fg=#16161e,bold"
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# Dim inactive panes slightly without sacrificing readability.
set -g window-style "fg=#a9b1d6,bg=#1a1b26"
set -g window-active-style "fg=#c0caf5,bg=#1a1b26"
##### TokyoNight Moon — the same palette LazyVim uses by default

source-file ~/.config/tmux/themes/tokyonight_moon.tmux

set -g status-position top
set -g status-right "#[fg=#828bb8,bg=#1e2030]#{?client_prefix,#[fg=#ffc777 bold] PREFIX  ,}#[fg=#3b4261]#[fg=#82aaff,bg=#3b4261,bold] 󰉋 #{b:pane_current_path} #[fg=#82aaff]#[fg=#1b1d2b,bg=#82aaff,bold] %H:%M "
setw -g window-status-bell-style "fg=#ff757f,bg=#1e2030,bold"

set -g pane-border-status off
set -g clock-mode-colour "#82aaff"
set -g clock-mode-style 24

# Dim inactive panes slightly without sacrificing readability.
set -g window-style "fg=#828bb8,bg=#222436"
set -g window-active-style "fg=#c8d3f5,bg=#222436"

# Machine-local overrides stay untracked and optional.
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
